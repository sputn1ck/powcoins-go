name: Build Chrome Extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Go tests
        run: go test ./...

      - name: Build extension assets
        run: ./tools/build_extension.sh

      - name: Validate extension JavaScript
        run: node --check extension/content.js

      - name: Package extension
        run: |
          cd extension
          zip -r robinet-webgpu-pow-extension.zip \
            manifest.json \
            content.js \
            faucetpow.wasm \
            wasm_exec.js \
            shader_unrolled.wgsl

      - name: Upload unpacked extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: robinet-webgpu-pow-extension-unpacked
          path: |
            extension/manifest.json
            extension/content.js
            extension/faucetpow.wasm
            extension/wasm_exec.js
            extension/shader_unrolled.wgsl
          if-no-files-found: error

      - name: Upload zipped extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: robinet-webgpu-pow-extension-zip
          path: extension/robinet-webgpu-pow-extension.zip
          if-no-files-found: error
